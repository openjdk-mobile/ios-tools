name: Combine XCFramework

on:
  schedule:
    - cron: '0 3 * * *' # run at 3 AM UTC
  workflow_dispatch:
    inputs:
      mobile_repo:
        description: 'URL of the OpenJDK Mobile repository to clone'
        type: string
        default: 'https://github.com/openjdk/mobile.git'
      mobile_ref:
        description: 'Branch, tag or commit hash of the OpenJDK Mobile repository to checkout'
        type: string
        default: 'master'

jobs:
  build-openjdk:
    uses: ./.github/workflows/build-openjdk.yml
    with:
      mobile_repo: ${{ inputs.mobile_repo || 'https://github.com/openjdk/mobile.git' }}
      mobile_ref: ${{ inputs.mobile_ref || 'master' }}

  build-openjdk-sim:
    uses: ./.github/workflows/build-openjdk-sim.yml
    with:
      mobile_repo: ${{ inputs.mobile_repo || 'https://github.com/openjdk/mobile.git' }}
      mobile_ref: ${{ inputs.mobile_ref || 'master' }}

  build-openjdk-macos:
    uses: ./.github/workflows/build-openjdk-macos.yml
    with:
      mobile_repo: ${{ inputs.mobile_repo || 'https://github.com/openjdk/mobile.git' }}
      mobile_ref: ${{ inputs.mobile_ref || 'master' }}

  combine:
    needs: [ build-openjdk, build-openjdk-sim, build-openjdk-macos ]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download JDK for macOS
        uses: actions/download-artifact@v8
        with:
          name: macos-jdk
          path: ./macos-jdk

      - name: Download java-modules for device
        uses: actions/download-artifact@v8
        with:
          name: java-modules-device
          path: ./java-modules-device

      - name: Create modules jimage for device
        run: |
          chmod +x ./macos-jdk/bin/jmod
          chmod +x ./macos-jdk/bin/jlink
          
          mkdir jmods-device
          module_names=("java.base" "java.desktop" "java.prefs" "java.xml" "java.datatransfer" "javafx.base" "javafx.graphics" "javafx.controls")
          for item in "${module_names[@]}"; do
            ./macos-jdk/bin/jmod create --class-path "./java-modules-device/$item" --target-platform ios-aarch64 "jmods-device/$item.jmod"
          done
          
          ./macos-jdk/bin/jlink --module-path ./jmods-device --add-modules javafx.controls --output java_bundle-device

      - name: Download java-modules for simulator
        uses: actions/download-artifact@v8
        with:
          name: java-modules-simulator
          path: ./java-modules-simulator

      - name: Create modules jimage for simulator
        run: |
          mkdir jmods-simulator
          module_names=("java.base" "java.desktop" "java.prefs" "java.xml" "java.datatransfer" "javafx.base" "javafx.graphics" "javafx.controls")
          for item in "${module_names[@]}"; do
            ./macos-jdk/bin/jmod create --class-path "./java-modules-simulator/$item" --target-platform ios-aarch64 "jmods-simulator/$item.jmod"
          done
          ./macos-jdk/bin/jlink --module-path ./jmods-simulator --add-modules javafx.controls --output java_bundle-simulator

      - name: Download and unzip mobile-support
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download libffi-build -p "libffi-ios.zip" -p "libffi-ios-sim.zip"
          unzip libffi-ios.zip -d libffi-ios
          unzip libffi-ios-sim.zip -d libffi-ios-sim

      - name: Download device artifact
        uses: actions/download-artifact@v8
        with:
          name: libs-device
          path: ./device

      - name: Download simulator artifact
        uses: actions/download-artifact@v8
        with:
          name: libs-simulator
          path: ./simulator

      - name: Create XCFramework
        run: |
          chmod +x .github/scripts/build-xcframework.sh
          .github/scripts/build-xcframework.sh

      - name: Compress XCFramework and modules jimage
        run: |
          zip -r macos-jdk.zip macos-jdk
          zip -r OpenJDK.xcframework.zip OpenJDK.xcframework
          zip -r java_bundle-device.zip java_bundle-device
          zip -r java_bundle-simulator.zip java_bundle-simulator

      - name: Upload XCFramework and modules jimage
        uses: actions/upload-artifact@v7
        with:
          path: |
            ./OpenJDK.xcframework
            ./java_bundle-device
            ./java_bundle-simulator

      - name: Create snapshot release
        uses: softprops/action-gh-release@v2
        with:
          name: "Snapshot release"
          tag_name: snapshot
          prerelease: true
          files: |
            macos-jdk.zip
            OpenJDK.xcframework.zip
            java_bundle-device.zip
            java_bundle-simulator.zip

      - name: Notify Slack on failure
        if: ${{ failure() || cancelled() }}
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          -d '{
            "text": ":x: *Workflow ${{ github.workflow }} failed* in *${{ github.repository }}* on branch *${{ github.ref_name }}* by *${{ github.actor }}*."
          }'

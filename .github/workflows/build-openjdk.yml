name: Build OpenJDK Mobile

on:
  workflow_call:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 'Install toolchain and dependencies'
        run: |
          # Run Homebrew installation and xcode-select
          brew install libffi
          brew install autoconf make
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          # This will make GNU make available as 'make' and not only as 'gmake' 
          echo '/usr/local/opt/make/libexec/gnubin' >> $GITHUB_PATH

      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download and unzip mobile-support
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download libffi-build --pattern "libffi-ios.zip"
          mkdir -p ../support
          unzip libffi-ios.zip -d ../support
          echo "unzip done"
          echo "$(realpath ../support)"

      - name: Patch and build OpenJFX sources
        run: |
          git clone https://github.com/openjdk/jfx.git
          cd jfx
          
          sh gradlew shadersClasses
          cd ..
          jfxversion=$(grep "^[#]*\s*jfx.release.major.version" jfx/build.properties | cut -d'=' -f2)$(grep "^[#]*\s*jfx.release.suffix=" jfx/build.properties | cut -d'=' -f2)
          if [ -z "$jfxversion" ]; then
            echo "Error: Failed to extract JavaFX version from build.properties"
            jfxversion="unknown"
          fi
          echo "RUNTIME_VERSION=$jfxversion" >> $GITHUB_ENV

      - name: Patch and build OpenJDK Mobile sources
        run: |
          git clone https://github.com/openjdk-mobile/openjfx-build.git
          
          git clone https://github.com/openjdk/mobile.git
          cd mobile
          patch -p1 < ../openjfx-build/openjdk-ext/src/jfx.patch
          
          cp ../openjdk-ext/src/hotspot/symbol_keeper.cpp src/hotspot/os/bsd
          
          bash configure \
            --with-conf-name=ios-aarch64-zero-release \
            --with-openjfx-modules=../jfx \
            --disable-warnings-as-errors \
            --openjdk-target=aarch64-macos-ios \
            --with-sysroot=/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk \
            --with-libffi-include=$(realpath ../../support/include/ffi) \
            --with-libffi-lib=$(realpath ../../support) \
            --with-cups-include=$(xcrun --sdk macosx --show-sdk-path)/usr/include
          make LOG=cmdlines,info CONF=ios-aarch64-zero-release javafx.controls-java javafx.fxml-java static-libs-image
          cp build/ios-aarch64-zero-release/jdk/include/ios/jni_md.h build/ios-aarch64-zero-release/jdk/include/
          cd ..
        env:
          RUNTIME_VERSION: ${{ env.RUNTIME_VERSION }}

      - name: Upload device artifact
        uses: actions/upload-artifact@v4
        with:
          name: libs-device
          path: |
            mobile/build/ios-aarch64-zero-release/images/static-libs/lib
            mobile/build/ios-aarch64-zero-release/jdk/include

      - name: Upload device modules
        uses: actions/upload-artifact@v4
        with:
          name: java-modules-device
          path: |
            mobile/build/ios-aarch64-zero-release/jdk/modules

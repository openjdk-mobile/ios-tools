name: Build OpenJDK Mobile for ios sim

on:
  workflow_call:
    inputs:
      mobile_repo:
        description: 'URL of the OpenJDK Mobile repository to clone'
        type: string
        default: 'https://github.com/openjdk/mobile.git'
      mobile_ref:
        description: 'Branch, tag or commit hash of the OpenJDK Mobile repository to checkout'
        type: string
        default: 'master'

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 'Install toolchain and dependencies'
        run: |
          # Run Homebrew installation and xcode-select
          brew install libffi
          brew install autoconf make
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          # This will make GNU make available as 'make' and not only as 'gmake' 
          echo '/usr/local/opt/make/libexec/gnubin' >> $GITHUB_PATH

      - name: Checkout builder repo
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download and unzip mobile-support
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download libffi-build --pattern "libffi-ios-sim.zip"
          mkdir -p ../support
          unzip libffi-ios-sim.zip -d ../support
          echo "unzip done"
          echo "$(realpath ../support)"

      - name: Patch and build OpenJFX sources
        run: |
          git clone https://github.com/openjdk/jfx.git
          cd jfx

          sh gradlew shadersClasses
          jfxversion=$(grep "^[#]*\s*jfx.release.major.version" build.properties | cut -d'=' -f2)$(grep "^[#]*\s*jfx.release.suffix=" build.properties | cut -d'=' -f2)
          if [ -z "$jfxversion" ]; then
            echo "Error: Failed to extract JavaFX version from build.properties"
            jfxversion="unknown"
          fi
          echo "RUNTIME_VERSION=$jfxversion" >> $GITHUB_ENV

      - name: Patch and build OpenJDK Mobile sources
        run: |
          git clone https://github.com/openjdk-mobile/openjfx-build.git
          
          git clone -- "$MOBILE_REPO" mobile
          cd mobile
          git checkout "$MOBILE_REF"
          patch -p1 < ../openjfx-build/openjdk-ext/src/jfx.patch
          
          cp ../openjdk-ext/src/hotspot/symbol_keeper.cpp src/hotspot/os/bsd
          
          bash configure \
            --with-conf-name=iossim-aarch64-zero-release \
            --with-openjfx-modules=../jfx \
            --disable-warnings-as-errors \
            --openjdk-target=aarch64-macos-ios \
            --with-sysroot=/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk \
            --with-libffi-include=$(realpath ../../support/include/ffi) \
            --with-libffi-lib=$(realpath ../../support) \
            --with-extra-cflags="-target arm64-apple-ios-simulator -mios-simulator-version-min=18.2" \
            --with-extra-cxxflags="-target arm64-apple-ios-simulator -mios-simulator-version-min=18.2" \
            --with-cups-include=$(xcrun --sdk macosx --show-sdk-path)/usr/include
          make LOG=cmdlines,info CONF=iossim-aarch64-zero-release javafx.controls-java javafx.fxml-java static-libs-image
          cp build/iossim-aarch64-zero-release/jdk/include/ios/jni_md.h build/iossim-aarch64-zero-release/jdk/include/
        env:
          RUNTIME_VERSION: ${{ env.RUNTIME_VERSION }}
          MOBILE_REPO: ${{ inputs.mobile_repo }}
          MOBILE_REF: ${{ inputs.mobile_ref }}

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v7
        with:
          name: libs-simulator
          path: |
            mobile/build/iossim-aarch64-zero-release/images/static-libs/lib
            mobile/build/iossim-aarch64-zero-release/jdk/include

      - name: Upload simulator modules
        uses: actions/upload-artifact@v7
        with:
          name: java-modules-simulator
          path: |
            mobile/build/iossim-aarch64-zero-release/jdk/modules
